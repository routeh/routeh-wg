# The plugin's release: built, tested in QEMU, proposed to the feed
# (routeh-plugin's plugin.yml; its docs/RELEASE.md).
#
#   a tag v<version>   every target of build.toml, stable OpenWrt
#   by hand            a version, an OpenWrt release, some targets
#   every day          the latest tag, for targets the feed lacks (a new kernel)
#
# Needs: the variables FEED_REPOSITORY (owner/feed) and FEED_URL (where
# the feed is served), the secret FEED_DEPLOY_KEY (of the repository or
# the organisation, not of an environment).

name: build

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag of the version (v3.1.20261113.2-r1); empty: the latest tag"
        required: false
      openwrt:
        description: "OpenWrt release (25.12.6), or stable"
        default: stable
      targets:
        description: "all, or targets separated by commas (mediatek/filogic,armsr/armv8)"
        default: all
      publish:
        description: "Propose the bundles to the feed"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.version || github.ref_name }}-${{ inputs.openwrt || 'stable' }}

jobs:
  build:
    uses: routeh/routeh-plugin/.github/workflows/plugin.yml@main
    with:
      version: ${{ inputs.version || '' }}
      openwrt: ${{ inputs.openwrt || 'stable' }}
      targets: ${{ inputs.targets || 'all' }}
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
      only_missing: ${{ github.event_name == 'schedule' }}
      feed_repository: ${{ vars.FEED_REPOSITORY }}
      feed_url: ${{ vars.FEED_URL }}
    secrets:
      FEED_DEPLOY_KEY: ${{ secrets.FEED_DEPLOY_KEY }}
