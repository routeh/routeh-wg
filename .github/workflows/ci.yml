# Every push and pull request: lints, tests, and the netlink binding on the
# runner's kernel (its WireGuard; AmneziaWG is tested in QEMU by build.yml).

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The toolchain of rust-toolchain.toml, clippy with it.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Against the runner's kernel
        run: |
          sudo modprobe wireguard || true
          cargo test -p awg-netlink --test live --no-run
          sudo -E env "PATH=$PATH" AWG_LIVE=1 cargo test -p awg-netlink --test live -- --test-threads=1 --nocapture
