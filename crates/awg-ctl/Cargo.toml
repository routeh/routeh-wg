[package]
name = "awg-ctl"
version = "0.1.0"
description = "The AmneziaWG plugin's service for the routeh router"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
awg-netlink = { path = "../awg-netlink" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
